# デプロイは CI からだけ行う（AGENTS.md 3章）。
# main への push で検証環境へ自動でデプロイし、本番は承認（GitHub Environments の必須レビュー）の後にデプロイする。
# Cloudflare の準備（docs/operations.md 1章）が済むまでは動かさない。リポジトリの変数 DEPLOY_ENABLED を true にすると有効になる。
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  staging:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: ログイン情報（D1）のマイグレーション
        run: bunx wrangler d1 migrations apply AUTH_DB --env staging --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: bunx wrangler deploy --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  production:
    runs-on: ubuntu-latest
    needs: staging
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
      - run: bun install --frozen-lockfile
      - name: ログイン情報（D1）のマイグレーション
        run: bunx wrangler d1 migrations apply AUTH_DB --env production --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: bunx wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
